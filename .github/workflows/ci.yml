name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Fetch veltrio-core
        run: ./scripts/fetch-core.sh
        env:
          GH_TOKEN: ${{ secrets.CORE_RELEASES_TOKEN || github.token }}
      - name: Fetch libmpv
        run: ./scripts/fetch-mpv.sh
      # Everything below switches on once the solution is committed.
      - uses: actions/setup-dotnet@v4
        if: hashFiles('*.sln') != ''
        with:
          dotnet-version: 10.0.x
      - name: Build
        if: hashFiles('*.sln') != ''
        run: dotnet build Veltrio.Windows.sln -c Release -p:Platform=x64
