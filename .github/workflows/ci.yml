name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Fetch veltrio-core
        run: ./scripts/fetch-core.sh
        env:
          GH_TOKEN: ${{ secrets.CORE_RELEASES_TOKEN }}
      # Everything below switches on once the solution is committed.
      - uses: actions/setup-dotnet@v4
        if: hashFiles('*.sln') != ''
        with:
          dotnet-version: 8.0.x
      - name: Build and test
        if: hashFiles('*.sln') != ''
        run: dotnet build -c Release && dotnet test -c Release --no-build
