name: Release

# Tag vX.Y.Z → Release build of the app, packaged with Velopack: a
# Setup.exe that installs without admin rights, a portable zip, and the
# packages the installed app updates itself from (it reads this
# repository's releases). Signed when VELTRIO_SIGN_PARAMS is set.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # hashFiles() isn't available in a job's `if`, so a cheap Linux job
  # checks for the app project first.
  detect:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.check.outputs.project }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: if compgen -G "*.sln" > /dev/null; then echo project=true; else echo project=false; fi >> "$GITHUB_OUTPUT"

  release:
    needs: detect
    if: needs.detect.outputs.project == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/fetch-core.sh
        env:
          GH_TOKEN: ${{ secrets.CORE_RELEASES_TOKEN || github.token }}
      - run: ./scripts/fetch-mpv.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # vX.Y.Z[-suffix] → version X.Y.Z[-suffix]; manual runs build 0.0.0-dev.
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      # Trakt and SIMKL stay off in the app while these secrets are unset.
      - run: dotnet publish src/Veltrio/Veltrio.csproj -c Release -p:Platform=x64 -p:Version=$VERSION -o dist/Veltrio
        env:
          VELTRIO_TRAKT_CLIENT_ID: ${{ secrets.VELTRIO_TRAKT_CLIENT_ID }}
          VELTRIO_TRAKT_CLIENT_SECRET: ${{ secrets.VELTRIO_TRAKT_CLIENT_SECRET }}
          VELTRIO_SIMKL_CLIENT_ID: ${{ secrets.VELTRIO_SIMKL_CLIENT_ID }}
      # Without the app's .pri (its compiled XAML) the app dies at launch.
      - name: Check the output
        run: for f in Veltrio.exe Veltrio.pri veltrio_core.dll libmpv-2.dll av_libglesv2.dll cacert.pem; do test -f "dist/Veltrio/$f" || { echo "missing $f"; exit 1; }; done
      - run: dotnet tool install -g vpk --version 1.2.161
      # Installs to %LOCALAPPDATA%\VeltrioApp: the app's data lives in
      # %LOCALAPPDATA%\Veltrio, which an uninstall must not delete.
      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_PARAMS: ${{ secrets.VELTRIO_SIGN_PARAMS }}
        run: |
          pre=(); [[ "$VERSION" == *-* ]] && pre=(--pre)
          # The previous release, for delta updates; none the first time.
          vpk download github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "$GH_TOKEN" "${pre[@]}" -o Releases || true
          sign=(); [ -n "$SIGN_PARAMS" ] && sign=(--signParams "$SIGN_PARAMS")
          vpk pack --packId VeltrioApp --packVersion "$VERSION" --packDir dist/Veltrio --mainExe Veltrio.exe \
            --packTitle Veltrio --packAuthors VeltrioApp --icon src/Veltrio/Assets/Veltrio.ico -o Releases "${sign[@]}"
          ls -la Releases
      - uses: actions/upload-artifact@v4
        with:
          name: Veltrio-${{ env.VERSION }}-win-x64
          path: |
            Releases/*-win-Setup.exe
            Releases/*-win-Portable.zip
          retention-days: 7
      # A tag with a suffix (v0.2.0-beta.1) is a pre-release. Every file in
      # Releases goes up: the updater needs the feed and the packages.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; [[ "$VERSION" == *-* ]] && pre="--prerelease"
          # This version's packages and the feed; not the previous release
          # downloaded above for the deltas.
          files=(Releases/*-win-Setup.exe Releases/*-win-Portable.zip Releases/*-"$VERSION"-*.nupkg Releases/releases.win.json Releases/assets.win.json Releases/RELEASES)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "Veltrio $VERSION pour Windows" --generate-notes $pre
